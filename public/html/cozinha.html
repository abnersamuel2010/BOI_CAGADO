<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozinha | Boi Ralado Smart Kitchen</title>
  <link rel="icon" type="image/png" href="../img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/cozinha.css" />
</head>
<body class="kz">
  <header class="kz-top">
    <div class="kz-brand">
      <img src="../img/logo.png" alt="Logo Boi Ralado" />
      <div><h1>Boi Ralado</h1><span>Smart Kitchen</span></div>
    </div>
    <nav class="kz-nav">
      <a href="cozinha.html" class="active"><i class="fa-solid fa-kitchen-set"></i> Cozinha</a>
      <a href="movimento.html"><i class="fa-solid fa-chart-simple"></i> Movimento</a>
      <a href="relatorios.html"><i class="fa-solid fa-file-lines"></i> Relatórios</a>
      <a href="perfil.html"><i class="fa-solid fa-user"></i> Perfil</a>
    </nav>
    <div class="kz-clock">
      <i class="fa-regular fa-clock"></i>
      <div><b id="kzHora">--:--:--</b><small id="kzData">--</small></div>
    </div>
  </header>

  <div class="kz-aviso" id="kzAviso" hidden></div>

  <section class="kz-stats">
    <div class="kz-stat kz-stat--novo"><i class="fa-solid fa-cart-shopping"></i><div><b id="stNovo">0</b><span>Novos Pedidos</span></div></div>
    <div class="kz-stat kz-stat--preparo"><i class="fa-solid fa-fire"></i><div><b id="stPreparo">0</b><span>Em Preparação</span></div></div>
    <div class="kz-stat kz-stat--pronto"><i class="fa-solid fa-circle-check"></i><div><b id="stPronto">0</b><span>Prontos</span></div></div>
    <div class="kz-stat kz-stat--entrega"><i class="fa-solid fa-motorcycle"></i><div><b id="stEntrega">0</b><span>Em Entrega</span></div></div>
  </section>

  <main class="kz-board">
    <section class="kz-col kz-col--novo">
      <header><h2><i class="fa-solid fa-bell"></i> Novos Pedidos</h2><span class="kz-count" id="cntNovo">0</span></header>
      <div class="kz-list" id="colNovo"></div>
    </section>
    <section class="kz-col kz-col--preparo">
      <header><h2><i class="fa-solid fa-fire"></i> Em Preparação</h2><span class="kz-count" id="cntPreparo">0</span></header>
      <div class="kz-list" id="colPreparo"></div>
    </section>
    <section class="kz-col kz-col--pronto">
      <header><h2><i class="fa-solid fa-circle-check"></i> Prontos</h2><span class="kz-count" id="cntPronto">0</span></header>
      <div class="kz-list" id="colPronto"></div>
    </section>
    <section class="kz-col kz-col--final">
      <header><h2><i class="fa-solid fa-flag-checkered"></i> Finalizados</h2><span class="kz-count" id="cntFinal">0</span></header>
      <div class="kz-list" id="colFinal"></div>
    </section>
  </main>

  <footer class="kz-foot">
    <div class="kz-foot__brand"><i class="fa-solid fa-fire"></i> Boi Ralado — Restaurante</div>
    <div class="kz-foot__tag">Sabor, qualidade e agilidade em um só lugar!</div>
    <div class="kz-foot__right">
      <a href="https://www.instagram.com/puzzlesoftwares/" target="_blank" rel="noopener" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <span class="kz-dev"><img src="../img/logo-puzzle.jpg" alt="PuzzleSoftwares" /><small>Desenvolvido por<br /><b>PuzzleSoftwares</b></small></span>
    </div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/cozinha.js"></script>
</body>
</html>
